name: Import onboarding hotels

on:
  workflow_dispatch:
    inputs:
      file:
        description: JSON batch file (relative to repo root)
        required: false
        default: data/italy-premier-hotels-30.json
      dry_run:
        description: Dry run (list hotels only, no DB writes)
        type: boolean
        default: false
      apply_migration:
        description: Apply description column migration via Supabase CLI
        type: boolean
        default: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        if: inputs.apply_migration
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migration (onboarding_hotels.description)
        if: inputs.apply_migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: tavbgqcsizqdceobauli
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Skip migration: SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD not set."
            echo "Ensure column description exists on onboarding_hotels before import."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push

      - name: Import hotels batch
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          FILE="${{ inputs.file }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/import-onboarding-hotels-batch.mjs --file "$FILE" --dry-run
          else
            node scripts/import-onboarding-hotels-batch.mjs --file "$FILE" --delay-ms 600
          fi
